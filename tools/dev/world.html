<script type="module">
import * as THREE from 'three';
import { getTrack } from '/js/core/tracks.js';
import { buildWorld } from '/js/render/world.js';
import { createVehicle } from '/js/render/vehicles.js';
const q = new URLSearchParams(location.search);

renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;

</script></body></html>
